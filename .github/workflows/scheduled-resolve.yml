# Scheduled resolve — daily check that the published install spec still
# resolves: `cortex-command[all] @ git+<repo>@<latest vX.Y.Z tag>` (the
# `uv tool install` snippet CLAUDE.md documents), where <latest tag> is
# resolved the same way install.sh's resolve_latest_tag() does — highest
# `vX.Y.Z` ref from `git ls-remote --tags`.
#
# Scope: resolution only. No wheel build, no console-script invocation —
# release.yml and validate.yml already cover those paths.
#
# Failure this guards against: any pinned or bounded dependency of a
# published tag stops resolving (e.g. yanked from PyPI, or an incompatible
# transitive released upstream) — the 2026-09-16 yank that broke every
# v5.2.0 install. Without this, that failure is invisible until a consumer's
# `uv tool install` hits it cold. Registered as a survivor ("scheduled
# resolve") in cortex/requirements/project.md's "Enforcement gates carry
# named evidence" entry.
#
# Trigger: daily cron, plus manual workflow_dispatch for on-demand checks.

name: Scheduled resolve

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Resolve latest published tag
        id: tag
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/charleshall888/cortex-command.git \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve latest vX.Y.Z tag via git ls-remote --tags"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest tag: ${TAG}"

      - name: Resolve published install spec (uv pip compile)
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          SPEC_FILE="${RUNNER_TEMP}/cortex-command-install-spec.txt"
          echo "cortex-command[all] @ git+https://github.com/charleshall888/cortex-command.git@${TAG}" > "$SPEC_FILE"
          if ! uv pip compile "$SPEC_FILE"; then
            echo "::error::uv pip compile could not resolve cortex-command[all] @ git+https://github.com/charleshall888/cortex-command.git@${TAG} — a pinned or bounded dependency of the published tag has stopped resolving."
            exit 1
          fi
          echo "Resolved cleanly: cortex-command[all] @ git+https://github.com/charleshall888/cortex-command.git@${TAG}"
